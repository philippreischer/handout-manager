name: CI
 
on:
  push:
    branches: [main]
  pull_request:
 
# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
 
      # verify runs the unit tests and, later, the Testcontainers tests.
      - run: ./mvnw -B --no-transfer-progress verify
 
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          # The lockfile is not at the repository root, so the path is explicit.
          cache-dependency-path: frontend/package-lock.json
 
      # ci instead of install: installs exactly what the lockfile pins
      # and fails if package.json and the lockfile disagree.
      - run: npm ci
 
      - run: npm run type-check
 
      - run: npm run lint-ci
 
      # run instead of the test:unit script: never watch mode, whatever
      # the environment reports.
      - run: npx vitest run