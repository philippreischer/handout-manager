spring.application.name=backend

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/handout_manager
spring.datasource.username=handout_manager
# WARNING: Development only. Use a strong password in production.
spring.datasource.password=secret

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true