spring.application.name=backend

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/handout_manager
spring.datasource.username=handout_manager
# WARNING: Development only. Use a strong password in production.
spring.datasource.password=${DB_PASSWORD:secret}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- Error handling ---
# Never expose stack traces in HTTP responses (package structure, library
# versions and filter chain are reconnaissance material).
# NOTE: DevTools overrides this locally with its own development defaults and
# still shows the trace. DevTools is marked optional and is not part of the
# production jar, so this setting does take effect where it matters.
server.error.include-stacktrace=never

# --- JWT ---
# No default on purpose: if JWT_SECRET is not set, the application fails to start.
# Never commit a secret - not even a development one.
handout-manager.jwt.secret=${JWT_SECRET}

# Lifetimes are not secrets and therefore have defaults.
handout-manager.jwt.access-token-ttl=15m
handout-manager.jwt.refresh-token-ttl=14d

# --- Cookies ---
# Secure defaults: the production values live here, the local profile
# overrides them. Forgetting the profile leaves you on the safe side.
handout-manager.cookie.secure=true
handout-manager.cookie.same-site=Strict

# --- CORS ---
# Concrete origins are mandatory: with allowCredentials the browser rejects
# a wildcard. Override in production with the real frontend origin.
handout-manager.cors.allowed-origins=http://localhost:5173

# Where the mail links to. Same place as the CORS origin above, overridden in
# production with the real frontend URL.
handout-manager.password-reset.reset-url=http://localhost:5173/reset-password

# --- Mail ---
# Sender address of every outgoing mail. Mailtrap accepts anything here, a real
# provider only a verified domain - so this is configuration, never a literal.
handout-manager.email.from=no-reply@handout-manager.local

# No defaults on purpose, same rule as JWT_SECRET: without these the
# application fails to start rather than silently sending nothing.
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Mailtrap and every real provider require authenticated, encrypted SMTP.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Without explicit timeouts JavaMail waits indefinitely - and while the send is
# synchronous, the request that triggered it waits just as long.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# NOTE: host and port are set per profile. Unlike the settings above there is no
# production-ready default until a provider is chosen - a guessed host would be
# worse than a missing one.

# --- Password reset ---
# Short lifetime on purpose: while the link is valid it is as good as the
# password. Not a secret, so it has a default.
handout-manager.password-reset.token-ttl=30m