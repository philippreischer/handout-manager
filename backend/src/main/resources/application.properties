spring.application.name=backend

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/handout_manager
spring.datasource.username=handout_manager
# WARNING: Development only. Use a strong password in production.
spring.datasource.password=${DB_PASSWORD:secret}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- Error handling ---
# Never expose stack traces in HTTP responses (package structure, library
# versions and filter chain are reconnaissance material).
# NOTE: DevTools overrides this locally with its own development defaults and
# still shows the trace. DevTools is marked optional and is not part of the
# production jar, so this setting does take effect where it matters.
server.error.include-stacktrace=never

# --- JWT ---
# No default on purpose: if JWT_SECRET is not set, the application fails to start.
# Never commit a secret - not even a development one.
handout-manager.jwt.secret=${JWT_SECRET}

# Lifetimes are not secrets and therefore have defaults.
handout-manager.jwt.access-token-ttl=15m
handout-manager.jwt.refresh-token-ttl=14d

# --- Cookies ---
# Secure defaults: the production values live here, the local profile
# overrides them. Forgetting the profile leaves you on the safe side.
handout-manager.cookie.secure=true
handout-manager.cookie.same-site=Strict