# Local development only: a Secure cookie is rejected by browsers over
# plain HTTP, so the browser would never store the refresh token.
handout-manager.cookie.secure=false

# Mailtrap sandbox: collects every mail in a web inbox instead of delivering it,
# so no test mail can reach a real recipient.
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525

# No default in application.properties on purpose: a missing value must stop the
# application from starting instead of mailing links to localhost.
handout-manager.password-reset.reset-url=http://localhost:5173/reset-password